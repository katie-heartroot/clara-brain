<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara — Knowledge Explorer</title>
    <meta name="theme-color" content="#0f1712">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg: #0f1712;
            --bg-panel: #161f19;
            --bg-control: #1c261f;
            --border: rgba(45,90,61,0.3);
            --deep-leaf: #2d5a3d;
            --new-growth: #6b9e78;
            --kiln-gold: #c4854c;
            --warm-clay: #d4a574;
            --linen: #f7f4ef;
            --text: #ddd8ce;
            --text-secondary: #8a9d8e;
            --text-dim: #5c6e60;
            --accent: #c4854c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Lora', serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
        }

        header .left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 1.3rem;
            color: var(--linen);
        }

        header h1 span { color: var(--text-dim); }

        .stats-text {
            font-size: 0.72rem;
            color: var(--text-dim);
            letter-spacing: 0.03em;
        }

        .stats-text b { color: var(--accent); font-weight: 500; }

        header .right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        header a, header button {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.72rem;
            padding: 5px 14px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            font-family: 'Lora', serif;
            transition: all 0.15s;
        }

        header a:hover, header button:hover {
            color: var(--linen);
            border-color: var(--accent);
            background: rgba(196,133,76,0.1);
        }

        header button.active {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(196,133,76,0.12);
        }

        /* ── Search & Filters ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .toolbar input {
            background: var(--bg-control);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 14px;
            color: var(--text);
            font-family: 'Lora', serif;
            font-size: 0.8rem;
            outline: none;
            width: 200px;
            transition: border-color 0.15s;
        }

        .toolbar input:focus { border-color: var(--accent); }
        .toolbar input::placeholder { color: var(--text-dim); }

        .filter-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chip {
            font-size: 0.65rem;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }

        .chip:hover { border-color: var(--text-secondary); color: var(--text-secondary); }

        .chip.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(196,133,76,0.1);
        }

        /* ── Main View ── */
        .main {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #view-2d {
            width: 100%;
            height: 100%;
        }

        #view-2d svg {
            width: 100%;
            height: 100%;
        }

        /* ── Link & Node styles ── */
        .link {
            fill: none;
            stroke: var(--new-growth);
            stroke-opacity: 0.25;
            transition: stroke-opacity 0.15s;
        }

        .link.hl { stroke: var(--accent) !important; stroke-opacity: 0.8 !important; stroke-width: 2 !important; }
        .link.dim { stroke-opacity: 0.04 !important; }

        .node-g { cursor: pointer; }
        .node-g.dim { opacity: 0.08; }

        .node-g text {
            font-family: 'Lora', serif;
            fill: var(--text);
            font-size: 10px;
            pointer-events: none;
            text-anchor: middle;
        }

        .edge-label {
            font-family: 'Lora', serif;
            fill: var(--text-dim);
            font-size: 8px;
            pointer-events: none;
            text-anchor: middle;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* ── Detail Panel ── */
        #panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 340px;
            height: 100%;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding: 20px;
            z-index: 5;
            transition: transform 0.25s ease;
        }

        #panel.collapsed { transform: translateX(100%); }

        #panel h2 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 1.3rem;
            color: var(--linen);
            margin-bottom: 8px;
            word-break: break-word;
        }

        #panel h3 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 1rem;
            color: var(--accent);
            margin: 20px 0 10px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            margin-bottom: 8px;
        }

        .created {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 12px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .metric {
            text-align: center;
            padding: 10px 6px;
            background: var(--bg-control);
            border-radius: 8px;
        }

        .metric .val {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: var(--accent);
        }

        .metric .lbl {
            font-size: 0.6rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .conn {
            padding: 6px 0;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .conn:hover { color: var(--linen); }
        .conn .arrow { color: var(--text-dim); font-size: 0.7rem; }
        .conn .rtype { color: var(--text-dim); font-size: 0.65rem; min-width: 80px; }

        .obs {
            padding: 8px 12px;
            margin: 4px 0;
            background: var(--bg-control);
            border-radius: 6px;
            font-size: 0.8rem;
            line-height: 1.5;
            color: var(--text-secondary);
            border-left: 2px solid var(--deep-leaf);
        }

        .placeholder {
            color: var(--text-dim);
            font-size: 0.82rem;
            font-style: italic;
            padding: 40px 0;
            text-align: center;
        }

        .close-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
        }

        .close-panel:hover { color: var(--text); }

        /* ── Panel Image ── */
        .panel-image {
            margin: 12px 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--bg-control);
        }

        .panel-image img {
            width: 100%;
            display: block;
            border-radius: 7px;
        }

        /* ── Graph Controls ── */
        .controls {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            z-index: 4;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 200px;
            font-size: 0.72rem;
        }

        .controls.collapsed-ctrl { display: none; }

        .ctrl-toggle {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            color: var(--text-dim);
            font-size: 0.7rem;
            cursor: pointer;
            z-index: 4;
            font-family: 'Lora', serif;
        }

        .ctrl-toggle:hover { color: var(--accent); border-color: var(--accent); }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .control-row label {
            color: var(--text-dim);
            min-width: 70px;
        }

        .control-row input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
            height: 3px;
        }

        .control-row select {
            background: var(--bg-control);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
            padding: 2px 6px;
            font-family: 'Lora', serif;
            font-size: 0.7rem;
        }

        /* ── Color Legend ── */
        .color-legend {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            z-index: 4;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.65rem;
        }

        .color-legend .cl-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
        }

        .color-legend .cl-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── Tooltip ── */
        #tip {
            position: fixed;
            display: none;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.78rem;
            color: var(--text);
            pointer-events: none;
            z-index: 20;
            max-width: 280px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        #tip strong { color: var(--accent); }
        #tip .sub { color: var(--text-dim); font-size: 0.7rem; }

        /* ── Hint ── */
        .hint {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-dim);
            font-size: 0.7rem;
            opacity: 0.5;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 3;
        }

        /* ── Responsive ── */
        @media (max-width: 700px) {
            #panel { width: 100%; }
            .controls { bottom: 8px; left: 8px; min-width: 160px; }
            .color-legend { display: none; }
            header { padding: 8px 12px; }
            .toolbar { padding: 8px 12px; }
            .toolbar input { width: 140px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="left">
            <h1>Clara <span>Knowledge Explorer</span></h1>
            <span class="stats-text" id="stats"></span>
        </div>
        <div class="right">
            <a href="/brain">Brain</a>
            <a href="/">Chat</a>
        </div>
    </header>

    <div class="toolbar">
        <input type="text" id="search" placeholder="Search entities..." autocomplete="off">
        <div class="filter-chips" id="filter-chips"></div>
    </div>

    <div class="main">
        <div id="view-2d"></div>

        <!-- Detail Panel -->
        <div id="panel" class="collapsed">
            <button class="close-panel" onclick="closePanel()">&times;</button>
            <div class="placeholder">Click a node to explore its observations and connections</div>
        </div>

        <!-- Controls -->
        <div class="controls" id="controls">
            <div class="control-row">
                <label>Edge opacity</label>
                <input type="range" min="0" max="100" value="25" oninput="setEdgeOpacity(this.value/100)">
            </div>
            <div class="control-row">
                <label>Edge width</label>
                <input type="range" min="1" max="8" value="2" step="0.5" oninput="setEdgeWidth(+this.value)">
            </div>
            <div class="control-row">
                <label>Curve</label>
                <select onchange="setCurve(this.value)">
                    <option value="straight" selected>Straight</option>
                    <option value="arc">Arc</option>
                    <option value="bundle">Bundle</option>
                </select>
            </div>
            <div class="control-row">
                <label>Node style</label>
                <select onchange="setNodeStyle(this.value)">
                    <option value="glass" selected>Glass</option>
                    <option value="lit">Lit</option>
                </select>
            </div>
            <div class="control-row">
                <label>Image size</label>
                <input type="range" min="16" max="80" value="36" step="2" oninput="setImageSize(+this.value)">
            </div>
            <div class="control-row">
                <label>Fan hover</label>
                <input type="checkbox" onchange="toggleFanHover(this.checked)">
            </div>
            <div class="control-row">
                <label>Mouse gravity</label>
                <input type="checkbox" onchange="toggleMouseGravity(this.checked)">
            </div>
            <div class="control-row">
                <label>Starlights</label>
                <input type="checkbox" checked onchange="toggleStarlights(this.checked)">
            </div>
        </div>

        <div class="color-legend" id="color-legend"></div>
        <div class="hint" id="hint">drag nodes &middot; scroll to zoom &middot; hover for connections &middot; click for details</div>
        <div id="tip"></div>
    </div>

    <script>
    // =============================================
    //  STATE
    // =============================================
    var allNodes = [], allLinks = [];
    var activeFilters = new Set();
    var searchTerm = '';
    var selectedId = null;
    var hoveredNodeId = null;
    var sim = null;
    var imgSize = 36; // half-size of image squares

    // Controls state
    var edgeOpacity = 0.25;
    var edgeWidth = 2;
    var curveStyle = 'straight';
    var nodeStyle = 'glass';
    var fanHover = false;
    var mouseGravity = false;
    var starlights = true;
    var mouseX = 0, mouseY = 0;
    var hintTimer;

    // =============================================
    //  COLORS
    // =============================================
    var COLORS = {
        Person:         '#c4854c',
        Artwork:        '#c97b7b',
        Location:       '#6b9e78',
        Brand_Identity: '#2d8a5a',
        Equipment:      '#8a9d8e',
        Supply:         '#d4a574',
        Session:        '#7b9ec9',
        Concept:        '#a07bc9',
        Event:          '#c9c07b',
        Skill:          '#7bc9a0',
    };

    var DEFAULT_COLOR = '#8a9d8e';

    function colorOf(type) { return COLORS[type] || DEFAULT_COLOR; }

    var EDGE_COLORS = {
        'creates':      '#c4854c',
        'made_by':      '#c4854c',
        'located_in':   '#6b9e78',
        'lives_in':     '#6b9e78',
        'uses':         '#8a9d8e',
        'has':          '#d4a574',
        'part_of':      '#2d8a5a',
        'inspires':     '#a07bc9',
        'knows':        '#7b9ec9',
        'supports':     '#7bc9a0',
    };

    function edgeColorOf(type) {
        var t = (type || '').toLowerCase();
        for (var k in EDGE_COLORS) {
            if (t.indexOf(k) >= 0) return EDGE_COLORS[k];
        }
        return '#6b9e78';
    }

    // =============================================
    //  DATA LOADING
    // =============================================
    async function boot() {
        var resp = await fetch('/api/knowledge');
        var kg = await resp.json();
        ingest(kg);
    }

    function ingest(kg) {
        var entities = kg.entities || {};
        var relations = kg.relations || [];

        allNodes = Object.entries(entities).map(function(pair) {
            var name = pair[0], data = pair[1];
            var obs = data.observations || [];
            // Extract URL from observations for Image entities
            var imgUrl = data.thumbnail_url || data.image_url || null;
            if (!imgUrl) {
                for (var j = 0; j < obs.length; j++) {
                    if (obs[j].indexOf('URL:') === 0) {
                        imgUrl = obs[j].replace('URL:', '').trim();
                        break;
                    }
                }
            }
            // Rewrite heartroot.art → github.io until SSL cert is provisioned
            if (imgUrl && imgUrl.indexOf('https://heartroot.art/') === 0) {
                imgUrl = imgUrl.replace('https://heartroot.art/', 'https://katie-heartroot.github.io/heartroot-art/');
            }
            return {
                id: name,
                type: data.entity_type || 'Unknown',
                observations: obs,
                obsCount: obs.length,
                color: colorOf(data.entity_type),
                ts: data.created || null,
                degree: 0, inDeg: 0, outDeg: 0,
                thumbnail_url: imgUrl,
                image_url: imgUrl,
            };
        });

        var nodeSet = new Set(allNodes.map(function(n) { return n.id; }));

        allLinks = relations.filter(function(r) {
            return nodeSet.has(r.from_entity || r.from) && nodeSet.has(r.to_entity || r.to);
        }).map(function(r) {
            return {
                source: r.from_entity || r.from,
                target: r.to_entity || r.to,
                type: r.relation_type || '',
                color: edgeColorOf(r.relation_type),
            };
        });

        // Degree
        allLinks.forEach(function(l) {
            var s = allNodes.find(function(n) { return n.id === sid(l); });
            var t = allNodes.find(function(n) { return n.id === tid(l); });
            if (s) { s.degree++; s.outDeg++; }
            if (t) { t.degree++; t.inDeg++; }
        });

        // Stats
        var totalObs = allNodes.reduce(function(s, n) { return s + n.obsCount; }, 0);
        document.getElementById('stats').innerHTML =
            '<b>' + allNodes.length + '</b> entities &middot; <b>' + allLinks.length + '</b> relations &middot; <b>' + totalObs + '</b> observations';

        buildFilters();
        render2D();
    }

    function sid(l) { return typeof l.source === 'object' ? l.source.id : l.source; }
    function tid(l) { return typeof l.target === 'object' ? l.target.id : l.target; }

    // =============================================
    //  FILTERING
    // =============================================
    function visible() {
        var nodes = allNodes.filter(function(n) {
            if (activeFilters.size && !activeFilters.has(n.type)) return false;
            if (searchTerm && n.id.toLowerCase().indexOf(searchTerm) < 0) return false;
            return true;
        });
        var ids = new Set(nodes.map(function(n) { return n.id; }));
        var links = allLinks.filter(function(l) { return ids.has(sid(l)) && ids.has(tid(l)); });
        return { nodes: nodes, links: links };
    }

    function buildFilters() {
        var types = {};
        allNodes.forEach(function(n) { types[n.type] = (types[n.type] || 0) + 1; });
        var box = document.getElementById('filter-chips');
        box.innerHTML = Object.keys(types).sort().map(function(t) {
            return '<span class="chip" data-type="' + t + '" onclick="toggleFilter(\'' + t + '\')">' + t.replace(/_/g, ' ') + ' (' + types[t] + ')</span>';
        }).join('');

        // Color legend
        var legend = document.getElementById('color-legend');
        legend.innerHTML = Object.keys(types).sort().map(function(t) {
            return '<div class="cl-item"><div class="cl-dot" style="background:' + colorOf(t) + '"></div>' + t.replace(/_/g, ' ') + '</div>';
        }).join('');
    }

    function toggleFilter(type) {
        if (activeFilters.has(type)) activeFilters.delete(type);
        else activeFilters.add(type);

        document.querySelectorAll('.chip').forEach(function(c) {
            c.classList.toggle('active', activeFilters.has(c.dataset.type));
        });
        refresh();
    }

    document.getElementById('search').addEventListener('input', function(e) {
        searchTerm = e.target.value.trim().toLowerCase();
        refresh();
    });

    function refresh() {
        if (sim) sim.stop();
        render2D();
    }

    // =============================================
    //  CONTROLS
    // =============================================
    function setEdgeOpacity(v) {
        edgeOpacity = v;
        d3.selectAll('.link').style('stroke-opacity', v);
    }

    function setEdgeWidth(v) {
        edgeWidth = v;
        d3.selectAll('.link').style('stroke-width', v);
    }

    function setCurve(v) {
        curveStyle = v;
        if (sim) {
            d3.selectAll('.link').attr('d', function(l) { return linkPath(l); });
        }
    }

    function setNodeStyle(v) {
        nodeStyle = v;
        d3.selectAll('.node-circle').each(function(d) {
            var el = d3.select(this);
            if (v === 'glass') {
                el.attr('fill', 'url(#grad-' + d.type + ')');
                el.attr('filter', 'url(#glass)');
            } else if (v === 'lit') {
                el.attr('fill', d.color);
                el.attr('filter', 'url(#glow)');
            } else {
                el.attr('fill', d.color + 'cc');
                el.attr('filter', null);
            }
        });
    }

    function toggleFanHover(on) { fanHover = on; }

    function setImageSize(v) {
        imgSize = v;
        // Update all Image node elements
        d3.selectAll('.node-rect, .node-rect-border').each(function() {
            var el = d3.select(this);
            var d = el.datum ? el.datum() : d3.select(this.parentNode).datum();
            if (!d || d.type !== 'Image' || !d.thumbnail_url) return;
            el.attr('x', -imgSize).attr('y', -imgSize)
              .attr('width', imgSize * 2).attr('height', imgSize * 2);
        });
        d3.selectAll('.node-img').each(function() {
            var d = d3.select(this.parentNode).datum();
            if (!d || d.type !== 'Image' || !d.thumbnail_url) return;
            d3.select(this)
              .attr('x', -imgSize).attr('y', -imgSize)
              .attr('width', imgSize * 2).attr('height', imgSize * 2);
        });
        // Update clip path rects
        d3.selectAll('clipPath[id^="clip-img-"] rect').each(function() {
            d3.select(this)
              .attr('x', -imgSize).attr('y', -imgSize)
              .attr('width', imgSize * 2).attr('height', imgSize * 2);
        });
        // Update labels
        d3.selectAll('text').each(function() {
            var d = d3.select(this.parentNode).datum();
            if (!d) return;
            var dy = (d.type === 'Image' && d.thumbnail_url) ? imgSize + 13 : rad(d) + 13;
            d3.select(this).attr('dy', dy);
        });
        // Update collide force
        if (sim) {
            sim.force('collide').radius(function(d) {
                return (d.type === 'Image' && d.thumbnail_url) ? imgSize + 8 : rad(d) + 8;
            });
            sim.alpha(0.3).restart();
        }
    }

    function toggleMouseGravity(on) {
        mouseGravity = on;
        if (on && sim) {
            sim.alphaTarget(0.05).restart();
            svg.on('mousemove.gravity', function() {
                if (mouseGravity && sim) sim.alpha(Math.max(sim.alpha(), 0.1));
            });
        } else {
            if (sim) sim.alphaTarget(0);
            svg.on('mousemove.gravity', null);
        }
    }

    function toggleStarlights(on) {
        starlights = on;
        // Katie: show/hide starburst
        d3.selectAll('.katie-halo, .katie-rays, .katie-core')
            .style('display', on ? null : 'none');
        d3.selectAll('.katie-normal')
            .style('display', on ? 'none' : null);
        // Clara: show/hide fireflies
        d3.selectAll('.clara-halo, .clara-orbit-ring, .clara-fireflies, .clara-core')
            .style('display', on ? null : 'none');
        d3.selectAll('.clara-normal')
            .style('display', on ? 'none' : null);
    }

    // =============================================
    //  LINK PATH
    // =============================================
    function linkPath(l, fanIdx, fanTotal) {
        var sx = l.source.x, sy = l.source.y, tx = l.target.x, ty = l.target.y;
        if (sx === undefined) return 'M0,0';

        if (curveStyle === 'straight') {
            if (fanIdx !== undefined && fanTotal > 1) {
                var dx = tx - sx, dy = ty - sy;
                var nx = -dy, ny = dx;
                var len = Math.sqrt(nx * nx + ny * ny) || 1;
                var spread = 20;
                var offset = ((fanIdx - (fanTotal - 1) / 2) / Math.max(1, fanTotal - 1)) * spread;
                var cx = (sx + tx) / 2 + (nx / len) * offset;
                var cy = (sy + ty) / 2 + (ny / len) * offset;
                return 'M' + sx + ',' + sy + 'Q' + cx + ',' + cy + ' ' + tx + ',' + ty;
            }
            return 'M' + sx + ',' + sy + 'L' + tx + ',' + ty;
        }

        if (curveStyle === 'arc') {
            var dx2 = tx - sx, dy2 = ty - sy;
            var dr = Math.sqrt(dx2 * dx2 + dy2 * dy2) * 0.8;
            return 'M' + sx + ',' + sy + 'A' + dr + ',' + dr + ' 0 0,1 ' + tx + ',' + ty;
        }

        // bundle
        var mx = (sx + tx) / 2, my = (sy + ty) / 2;
        var ddx = tx - sx, ddy = ty - sy;
        var nnx = -ddy * 0.15, nny = ddx * 0.15;
        return 'M' + sx + ',' + sy + 'C' + (sx + ddx * 0.3 + nnx) + ',' + (sy + ddy * 0.3 + nny) + ' ' +
               (sx + ddx * 0.7 + nnx) + ',' + (sy + ddy * 0.7 + nny) + ' ' + tx + ',' + ty;
    }

    // =============================================
    //  2D RENDERER (D3)
    // =============================================
    function render2D() {
        var box = document.getElementById('view-2d');
        box.innerHTML = '';

        var data = visible();
        if (!data.nodes.length) {
            box.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-style:italic;">No entities match the current filters</div>';
            return;
        }

        var w = box.clientWidth || 800;
        var h = box.clientHeight || 600;

        var svg = d3.select(box).append('svg')
            .attr('width', w).attr('height', h);

        // Defs
        var defs = svg.append('defs');

        // Glow filter
        var glow = defs.append('filter').attr('id', 'glow');
        glow.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
        glow.append('feMerge').selectAll('feMergeNode').data(['blur', 'SourceGraphic']).enter()
            .append('feMergeNode').attr('in', function(d) { return d; });

        // Glass filter
        var glass = defs.append('filter').attr('id', 'glass');
        glass.append('feGaussianBlur').attr('in', 'SourceAlpha').attr('stdDeviation', '2').attr('result', 'shadow');
        glass.append('feOffset').attr('in', 'shadow').attr('dx', '1').attr('dy', '2').attr('result', 'offShadow');
        var glassMerge = glass.append('feMerge');
        glassMerge.append('feMergeNode').attr('in', 'offShadow');
        glassMerge.append('feMergeNode').attr('in', 'SourceGraphic');

        // Katie starburst filter — warm golden glow
        var starGlow = defs.append('filter').attr('id', 'starburst-glow')
            .attr('x', '-100%').attr('y', '-100%').attr('width', '300%').attr('height', '300%');
        starGlow.append('feGaussianBlur').attr('stdDeviation', '6').attr('result', 'bloom');
        var starMerge = starGlow.append('feMerge');
        starMerge.append('feMergeNode').attr('in', 'bloom');
        starMerge.append('feMergeNode').attr('in', 'bloom');
        starMerge.append('feMergeNode').attr('in', 'SourceGraphic');

        // Starburst radial gradient — bright white-gold center fading out
        var starGrad = defs.append('radialGradient').attr('id', 'grad-starburst')
            .attr('cx', '50%').attr('cy', '50%').attr('r', '50%');
        starGrad.append('stop').attr('offset', '0%').attr('stop-color', '#fffbe6').attr('stop-opacity', 1);
        starGrad.append('stop').attr('offset', '25%').attr('stop-color', '#f5d984').attr('stop-opacity', 0.9);
        starGrad.append('stop').attr('offset', '60%').attr('stop-color', '#c4854c').attr('stop-opacity', 0.4);
        starGrad.append('stop').attr('offset', '100%').attr('stop-color', '#c4854c').attr('stop-opacity', 0);

        // Ray gradient for light spikes
        var rayGrad = defs.append('linearGradient').attr('id', 'grad-ray')
            .attr('x1', '0%').attr('y1', '0%').attr('x2', '100%').attr('y2', '0%');
        rayGrad.append('stop').attr('offset', '0%').attr('stop-color', '#fffbe6').attr('stop-opacity', 0.8);
        rayGrad.append('stop').attr('offset', '100%').attr('stop-color', '#c4854c').attr('stop-opacity', 0);

        // Gradients for glass mode
        var usedTypes = {};
        data.nodes.forEach(function(n) { usedTypes[n.type] = n.color; });
        Object.keys(usedTypes).forEach(function(t) {
            var grad = defs.append('radialGradient')
                .attr('id', 'grad-' + t)
                .attr('cx', '35%').attr('cy', '35%').attr('r', '65%');
            grad.append('stop').attr('offset', '0%').attr('stop-color', '#fff').attr('stop-opacity', 0.4);
            grad.append('stop').attr('offset', '50%').attr('stop-color', usedTypes[t]).attr('stop-opacity', 0.8);
            grad.append('stop').attr('offset', '100%').attr('stop-color', usedTypes[t]).attr('stop-opacity', 1);
        });

        var g = svg.append('g');

        // Zoom
        var currentTransform = d3.zoomIdentity;
        var zoom = d3.zoom()
            .scaleExtent([0.1, 8])
            .on('zoom', function(ev) { currentTransform = ev.transform; g.attr('transform', ev.transform); });
        svg.call(zoom);

        // Track mouse position in simulation coordinates
        svg.on('mousemove', function(ev) {
            var pt = d3.pointer(ev);
            mouseX = (pt[0] - currentTransform.x) / currentTransform.k;
            mouseY = (pt[1] - currentTransform.y) / currentTransform.k;
        });

        // Fan indexing for parallel edges
        var edgeCounts = {};
        data.links.forEach(function(l) {
            var key = [sid(l), tid(l)].sort().join('|');
            edgeCounts[key] = (edgeCounts[key] || 0) + 1;
        });
        var edgeIdxMap = {};
        data.links.forEach(function(l) {
            var key = [sid(l), tid(l)].sort().join('|');
            if (!edgeIdxMap[key]) edgeIdxMap[key] = 0;
            l._fanIdx = edgeIdxMap[key]++;
            l._fanTotal = edgeCounts[key];
        });

        // Links
        var link = g.selectAll('.link')
            .data(data.links)
            .enter().append('path')
            .attr('class', 'link')
            .style('stroke', function(d) { return d.color; })
            .style('stroke-opacity', edgeOpacity)
            .style('stroke-width', edgeWidth);

        // Edge labels
        var edgeLabel = g.selectAll('.edge-label')
            .data(data.links)
            .enter().append('text')
            .attr('class', 'edge-label')
            .text(function(d) { return d.type; });

        // Node groups
        var nodeG = g.selectAll('.node-g')
            .data(data.nodes)
            .enter().append('g')
            .attr('class', 'node-g')
            .call(d3.drag()
                .on('start', function(ev, d) {
                    if (!ev.active) sim.alphaTarget(0.3).restart();
                    d.fx = d.x; d.fy = d.y;
                })
                .on('drag', function(ev, d) { d.fx = ev.x; d.fy = ev.y; })
                .on('end', function(ev, d) {
                    if (!ev.active) sim.alphaTarget(0).alphaDecay(0.02).alpha(0.5).restart();
                    d.fx = null; d.fy = null;
                })
            );

        // Node circles (non-Image nodes only)
        nodeG.each(function(d) {
            var el = d3.select(this);
            if (d.type === 'Image' && d.thumbnail_url) return; // handled below
            if (d.id === 'Katie-Tudor') {
                // Always render a normal circle (hidden when starburst is on)
                el.append('circle')
                    .attr('class', 'node-circle katie-normal')
                    .attr('r', rad(d))
                    .attr('fill', 'url(#grad-' + d.type + ')')
                    .attr('stroke', d.color)
                    .attr('stroke-width', 1.5)
                    .attr('filter', 'url(#glass)')
                    .style('display', starlights ? 'none' : null);
                return;
            }
            if (d.id === 'Clara') {
                // Normal circle fallback (hidden when starlights on)
                el.append('circle')
                    .attr('class', 'node-circle clara-normal')
                    .attr('r', rad(d))
                    .attr('fill', 'url(#grad-' + d.type + ')')
                    .attr('stroke', d.color)
                    .attr('stroke-width', 1.5)
                    .attr('filter', 'url(#glass)')
                    .style('display', starlights ? 'none' : null);
                return;
            }
            el.append('circle')
                .attr('class', 'node-circle')
                .attr('r', rad(d))
                .attr('fill', 'url(#grad-' + d.type + ')')
                .attr('stroke', d.color)
                .attr('stroke-width', 1.5)
                .attr('filter', 'url(#glass)');
        });

        // Katie-Tudor — burst of light
        nodeG.each(function(d) {
            if (d.id !== 'Katie-Tudor') return;
            var el = d3.select(this);
            var coreR = Math.max(rad(d), 18);
            var rayCount = 12;
            var rayLength = coreR * 3.5;

            // Outer halo
            el.append('circle')
                .attr('class', 'katie-halo')
                .attr('r', rayLength)
                .attr('fill', 'url(#grad-starburst)')
                .attr('filter', 'url(#starburst-glow)');

            // Light rays
            var rayGroup = el.append('g').attr('class', 'katie-rays');
            for (var i = 0; i < rayCount; i++) {
                var angle = (i / rayCount) * 360;
                var thick = (i % 2 === 0) ? 2.5 : 1.2;
                var len = (i % 2 === 0) ? rayLength : rayLength * 0.65;
                rayGroup.append('line')
                    .attr('x1', 0).attr('y1', 0)
                    .attr('x2', len).attr('y2', 0)
                    .attr('transform', 'rotate(' + angle + ')')
                    .attr('stroke', '#fffbe6')
                    .attr('stroke-width', thick)
                    .attr('stroke-opacity', (i % 2 === 0) ? 0.5 : 0.25)
                    .attr('stroke-linecap', 'round');
            }

            // Animate rays rotation
            function spinRays() {
                rayGroup.transition()
                    .duration(30000)
                    .ease(d3.easeLinear)
                    .attrTween('transform', function() {
                        return d3.interpolateString('rotate(0)', 'rotate(360)');
                    })
                    .on('end', spinRays);
            }
            spinRays();

            // Pulse the halo
            function pulseHalo() {
                el.select('.katie-halo').transition()
                    .duration(3000)
                    .ease(d3.easeSinInOut)
                    .attr('r', rayLength * 1.15)
                    .attr('opacity', 0.7)
                    .transition()
                    .duration(3000)
                    .ease(d3.easeSinInOut)
                    .attr('r', rayLength)
                    .attr('opacity', 1)
                    .on('end', pulseHalo);
            }
            pulseHalo();

            // Bright core circle
            el.append('circle')
                .attr('class', 'node-circle katie-core')
                .attr('r', coreR)
                .attr('fill', 'url(#grad-starburst)')
                .attr('stroke', '#f5d984')
                .attr('stroke-width', 2)
                .attr('filter', 'url(#starburst-glow)');
        });

        // Clara — orbiting fireflies
        nodeG.each(function(d) {
            if (d.id !== 'Clara') return;
            var el = d3.select(this);
            var coreR = Math.max(rad(d), 14);
            var orbitR = coreR * 2.8;
            var flyCount = 6;

            // Soft green-gold halo
            el.append('circle')
                .attr('class', 'clara-halo')
                .attr('r', orbitR * 1.1)
                .attr('fill', 'none')
                .attr('stroke', '#6b9e78')
                .attr('stroke-width', 0.5)
                .attr('stroke-opacity', 0.2)
                .attr('filter', 'url(#glow)');

            // Orbit ring (subtle)
            el.append('circle')
                .attr('class', 'clara-orbit-ring')
                .attr('r', orbitR)
                .attr('fill', 'none')
                .attr('stroke', '#6b9e78')
                .attr('stroke-width', 0.4)
                .attr('stroke-opacity', 0.15)
                .attr('stroke-dasharray', '3,6');

            // Firefly particles
            var flyGroup = el.append('g').attr('class', 'clara-fireflies');
            for (var i = 0; i < flyCount; i++) {
                var startAngle = (i / flyCount) * 360;
                var flyR = 2.5 + (i % 2) * 1;
                var fly = flyGroup.append('circle')
                    .attr('class', 'clara-fly')
                    .attr('r', flyR)
                    .attr('fill', i % 2 === 0 ? '#b8e6a0' : '#f5d984')
                    .attr('opacity', 0.7)
                    .attr('filter', 'url(#glow)');

                // Start each firefly at its position
                (function(flyEl, idx, r) {
                    var speed = 8000 + idx * 1400;
                    var wobbleR = r + (idx % 3 - 1) * 4;
                    function orbit() {
                        flyEl.transition()
                            .duration(speed)
                            .ease(d3.easeLinear)
                            .attrTween('cx', function() {
                                return function(t) {
                                    var a = ((idx / flyCount) + t) * Math.PI * 2;
                                    return Math.cos(a) * wobbleR;
                                };
                            })
                            .attrTween('cy', function() {
                                return function(t) {
                                    var a = ((idx / flyCount) + t) * Math.PI * 2;
                                    return Math.sin(a) * wobbleR * 0.7;
                                };
                            })
                            .on('end', orbit);
                    }
                    orbit();

                    // Gentle twinkle
                    function twinkle() {
                        flyEl.transition()
                            .duration(1200 + idx * 300)
                            .ease(d3.easeSinInOut)
                            .attr('opacity', 0.3)
                            .transition()
                            .duration(1200 + idx * 300)
                            .ease(d3.easeSinInOut)
                            .attr('opacity', 0.85)
                            .on('end', twinkle);
                    }
                    twinkle();
                })(fly, i, orbitR);
            }

            // Core circle — soft green glow
            el.append('circle')
                .attr('class', 'node-circle clara-core')
                .attr('r', coreR)
                .attr('fill', 'url(#grad-' + d.type + ')')
                .attr('stroke', '#6b9e78')
                .attr('stroke-width', 2)
                .attr('filter', 'url(#glow)');

            // Gentle pulse on Clara's core
            function pulseClara() {
                el.select('.clara-core').transition()
                    .duration(4000)
                    .ease(d3.easeSinInOut)
                    .attr('r', coreR * 1.1)
                    .attr('stroke-opacity', 0.6)
                    .transition()
                    .duration(4000)
                    .ease(d3.easeSinInOut)
                    .attr('r', coreR)
                    .attr('stroke-opacity', 1)
                    .on('end', pulseClara);
            }
            pulseClara();
        });

        // Image nodes — rounded square with thumbnail, lit glow
        // imgSize is a global, controlled by slider
        nodeG.each(function(d) {
            if (d.type !== 'Image' || !d.thumbnail_url) return;
            var el = d3.select(this);
            var clipId = 'clip-img-' + d.id.replace(/[^a-zA-Z0-9]/g, '_');

            // Rounded rect clip path
            defs.append('clipPath').attr('id', clipId)
                .append('rect')
                .attr('x', -imgSize).attr('y', -imgSize)
                .attr('width', imgSize * 2).attr('height', imgSize * 2)
                .attr('rx', 6).attr('ry', 6);

            // Background rect (for border/glow)
            el.append('rect')
                .attr('class', 'node-rect')
                .attr('x', -imgSize).attr('y', -imgSize)
                .attr('width', imgSize * 2).attr('height', imgSize * 2)
                .attr('rx', 6).attr('ry', 6)
                .attr('fill', 'none')
                .attr('stroke', d.color)
                .attr('stroke-width', 1.5)
                .attr('filter', 'url(#glow)');

            // The image itself
            el.append('image')
                .attr('class', 'node-img')
                .attr('href', d.thumbnail_url)
                .attr('width', imgSize * 2).attr('height', imgSize * 2)
                .attr('x', -imgSize).attr('y', -imgSize)
                .attr('clip-path', 'url(#' + clipId + ')')
                .attr('preserveAspectRatio', 'xMidYMid slice');

            // Stroke ring on top
            el.append('rect')
                .attr('class', 'node-rect-border')
                .attr('x', -imgSize).attr('y', -imgSize)
                .attr('width', imgSize * 2).attr('height', imgSize * 2)
                .attr('rx', 6).attr('ry', 6)
                .attr('fill', 'none')
                .attr('stroke', d.color)
                .attr('stroke-width', 1.5)
                .attr('stroke-opacity', 0.6);
        });

        // Node labels (skip Image nodes)
        nodeG.filter(function(d) { return !(d.type === 'Image' && d.thumbnail_url); })
            .append('text')
            .attr('dy', function(d) { return rad(d) + 13; })
            .text(function(d) { return trunc(d.id, 16); });

        // Interaction
        nodeG.on('mouseover', function(ev, d) {
            hoveredNodeId = d.id;
            showTip(ev, d);
            hlNeighbors(d, data.nodes, data.links);
            edgeLabel.style('opacity', function(l) {
                return sid(l) === d.id || tid(l) === d.id ? 0.7 : 0;
            });

            if (fanHover) {
                link.attr('d', function(l) {
                    if (sid(l) === d.id || tid(l) === d.id) {
                        return linkPath(l, l._fanIdx, l._fanTotal);
                    }
                    return linkPath(l);
                });
            }
        });

        nodeG.on('mousemove', function(ev) { moveTip(ev); });

        nodeG.on('mouseout', function() {
            hoveredNodeId = null;
            hideTip();
            clearHL();
            edgeLabel.style('opacity', 0);
            if (fanHover) {
                link.attr('d', function(l) { return linkPath(l); });
            }
        });

        nodeG.on('click', function(ev, d) { openPanel(d); });

        // Force simulation
        // Custom mouse gravity force
        function forceMouseGravity() {
            var nodes;
            function force(alpha) {
                if (!mouseGravity) return;
                nodes.forEach(function(d) {
                    var dx = d.x - mouseX;
                    var dy = d.y - mouseY;
                    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    var radius = 180;
                    if (dist < radius) {
                        var strength = (1 - dist / radius) * 8 * alpha;
                        d.vx += (dx / dist) * strength;
                        d.vy += (dy / dist) * strength;
                    }
                });
            }
            force.initialize = function(_) { nodes = _; };
            return force;
        }

        sim = d3.forceSimulation(data.nodes)
            .force('link', d3.forceLink(data.links).id(function(d) { return d.id; }).distance(120))
            .force('charge', d3.forceManyBody().strength(-350))
            .force('center', d3.forceCenter(w / 2, h / 2))
            .force('collide', d3.forceCollide().radius(function(d) {
                return (d.type === 'Image' && d.thumbnail_url) ? imgSize + 8 : rad(d) + 8;
            }))
            .force('mouse', forceMouseGravity());

        sim.on('tick', function() {
            link.attr('d', function(d) { return linkPath(d); });
            edgeLabel.attr('x', function(d) { return (d.source.x + d.target.x) / 2; })
                     .attr('y', function(d) { return (d.source.y + d.target.y) / 2; });
            nodeG.attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; });
        });

        // Show hint briefly
        var hint = document.getElementById('hint');
        hint.style.opacity = '0.5';
        clearTimeout(hintTimer);
        hintTimer = setTimeout(function() { hint.style.opacity = '0'; }, 4000);
    }

    function rad(d) { return Math.max(5, Math.sqrt(d.obsCount) * 3.8 + 4); }
    function trunc(s, n) { return s.length > n ? s.slice(0, n - 1) + '\u2026' : s; }

    // =============================================
    //  NEIGHBOR HIGHLIGHT
    // =============================================
    function hlNeighbors(d, nodes, links) {
        var conn = new Set([d.id]);
        links.forEach(function(l) {
            if (sid(l) === d.id) conn.add(tid(l));
            if (tid(l) === d.id) conn.add(sid(l));
        });
        d3.selectAll('.node-g').classed('dim', function(n) { return !conn.has(n.id); });
        d3.selectAll('.link').classed('dim', function(l) { return sid(l) !== d.id && tid(l) !== d.id; });
        d3.selectAll('.link').classed('hl', function(l) { return sid(l) === d.id || tid(l) === d.id; });
    }

    function clearHL() {
        d3.selectAll('.node-g').classed('dim', false);
        d3.selectAll('.link').classed('dim', false).classed('hl', false);
    }

    // =============================================
    //  DETAIL PANEL
    // =============================================
    function openPanel(d) {
        selectedId = d.id;
        var p = document.getElementById('panel');
        p.classList.remove('collapsed');

        var node = allNodes.find(function(n) { return n.id === d.id; }) || d;
        var out = [], inc = [];
        allLinks.forEach(function(l) {
            if (sid(l) === d.id) out.push({ entity: tid(l), rel: l.type });
            if (tid(l) === d.id) inc.push({ entity: sid(l), rel: l.type });
        });

        var h = '';
        h += '<button class="close-panel" onclick="closePanel()">&times;</button>';
        h += '<h2>' + esc(node.id) + '</h2>';
        h += '<div class="badge" style="background:' + node.color + '22;color:' + node.color + '">' + node.type.replace(/_/g, ' ') + '</div>';

        if (node.ts) {
            h += '<div class="created">' + new Date(node.ts).toLocaleDateString('en-US',
                { month: 'short', day: 'numeric', year: 'numeric' }) + '</div>';
        }

        // Show image for Image entities
        if (node.type === 'Image') {
            var imgUrl = node.image_url || node.thumbnail_url || '';
            if (!imgUrl) {
                // Try to find URL in observations
                for (var i = 0; i < node.observations.length; i++) {
                    var ob = node.observations[i];
                    if (ob.indexOf('URL:') === 0) {
                        imgUrl = ob.replace('URL:', '').trim();
                        break;
                    }
                }
            }
            // Rewrite heartroot.art → github.io until SSL cert is provisioned
            if (imgUrl && imgUrl.indexOf('https://heartroot.art/') === 0) {
                imgUrl = imgUrl.replace('https://heartroot.art/', 'https://katie-heartroot.github.io/heartroot-art/');
            }
            if (imgUrl) {
                h += '<div class="panel-image">';
                h += '<img src="' + esc(imgUrl) + '" alt="' + esc(node.id) + '" onerror="this.parentElement.style.display=\'none\'">';
                h += '</div>';
            }
        }

        h += '<div class="metrics">';
        h += '<div class="metric"><div class="val">' + node.obsCount + '</div><div class="lbl">Observations</div></div>';
        h += '<div class="metric"><div class="val">' + node.degree + '</div><div class="lbl">Connections</div></div>';
        h += '<div class="metric"><div class="val">' + node.outDeg + '</div><div class="lbl">Outgoing</div></div>';
        h += '<div class="metric"><div class="val">' + node.inDeg + '</div><div class="lbl">Incoming</div></div>';
        h += '</div>';

        if (out.length || inc.length) {
            h += '<h3>Connections</h3>';
            out.forEach(function(c) {
                var cn = allNodes.find(function(n) { return n.id === c.entity; });
                h += '<div class="conn" onclick="navTo(\'' + c.entity.replace(/'/g, "\\'") + '\')">' +
                    '<span class="arrow">\u2192</span><span class="rtype">' + c.rel + '</span>' +
                    '<span style="color:' + (cn ? cn.color : '#666') + '">' + esc(c.entity) + '</span></div>';
            });
            inc.forEach(function(c) {
                var cn = allNodes.find(function(n) { return n.id === c.entity; });
                h += '<div class="conn" onclick="navTo(\'' + c.entity.replace(/'/g, "\\'") + '\')">' +
                    '<span class="arrow">\u2190</span><span class="rtype">' + c.rel + '</span>' +
                    '<span style="color:' + (cn ? cn.color : '#666') + '">' + esc(c.entity) + '</span></div>';
            });
        }

        if (node.observations.length) {
            h += '<h3>Observations</h3>';
            node.observations.forEach(function(o) {
                h += '<div class="obs">' + esc(o) + '</div>';
            });
        }

        p.innerHTML = h;
    }

    function closePanel() {
        selectedId = null;
        var p = document.getElementById('panel');
        p.classList.add('collapsed');
        p.innerHTML = '<button class="close-panel" onclick="closePanel()">&times;</button>' +
            '<div class="placeholder">Click a node to explore its observations and connections</div>';
    }

    function navTo(id) {
        var node = allNodes.find(function(n) { return n.id === id; });
        if (node) openPanel(node);
    }

    function esc(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    // =============================================
    //  TOOLTIP
    // =============================================
    function showTip(ev, d) {
        var t = document.getElementById('tip');
        t.innerHTML = '<strong>' + esc(d.id) + '</strong><br><span class="sub">' + d.type.replace(/_/g, ' ') + ' &middot; ' + d.obsCount + ' obs &middot; ' + d.degree + ' conn</span>';
        t.style.display = 'block';
        moveTip(ev);
    }

    function moveTip(ev) {
        var t = document.getElementById('tip');
        t.style.left = (ev.clientX + 14) + 'px';
        t.style.top = (ev.clientY - 12) + 'px';
    }

    function hideTip() { document.getElementById('tip').style.display = 'none'; }

    // =============================================
    //  KEYBOARD
    // =============================================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closePanel();
            clearHL();
            document.getElementById('search').value = '';
            searchTerm = '';
            refresh();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
            e.preventDefault();
            document.getElementById('search').focus();
        }
    });

    // =============================================
    //  RESIZE
    // =============================================
    var resizeTimer;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() { render2D(); }, 150);
    });

    // =============================================
    //  BOOT
    // =============================================
    requestAnimationFrame(function() {
        requestAnimationFrame(function() {
            boot().catch(function(e) {
                console.error('Boot failed:', e);
                document.getElementById('stats').textContent = 'Error: ' + e.message;
            });
        });
    });
    </script>

    <!-- ── Session Security ── -->
    <style>
    .quick-lock{position:fixed;top:12px;right:12px;z-index:9999;width:36px;height:36px;border-radius:50%;background:rgba(44,44,40,0.7);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .3s;backdrop-filter:blur(4px)}
    .quick-lock:hover{background:rgba(163,74,40,0.8);color:#fff;border-color:rgba(196,133,76,0.5)}
    </style>
    <button class="quick-lock" onclick="claraLock()" title="Lock">&#x1f512;</button>
    <script>
    (function(){
        const HEARTBEAT_MS = 120000;
        const INACTIVITY_MS = 300000;
        const BG_TIMEOUT_MS = 120000;
        let lastActivity = Date.now();
        let bgTimer = null;

        function goDecoy(){ window.location.replace('/'); }

        window.claraLock = function(){
            fetch('/auth/lock',{method:'POST',credentials:'same-origin'})
            .finally(goDecoy);
        };

        setInterval(function(){
            fetch('/auth/heartbeat',{method:'POST',credentials:'same-origin'})
            .then(r=>{if(!r.ok)goDecoy();})
            .catch(()=>{});
        }, HEARTBEAT_MS);

        ['mousemove','keydown','touchstart','scroll'].forEach(function(evt){
            document.addEventListener(evt, function(){lastActivity=Date.now();}, {passive:true});
        });
        setInterval(function(){
            if(Date.now()-lastActivity > INACTIVITY_MS) window.claraLock();
        }, 30000);

        document.addEventListener('visibilitychange', function(){
            if(document.hidden){
                bgTimer = setTimeout(function(){window.claraLock();}, BG_TIMEOUT_MS);
            } else {
                if(bgTimer){clearTimeout(bgTimer);bgTimer=null;}
                fetch('/auth/heartbeat',{method:'POST',credentials:'same-origin'})
                .then(r=>{if(!r.ok)goDecoy();});
            }
        });
    })();
    </script>
</body>
</html>
