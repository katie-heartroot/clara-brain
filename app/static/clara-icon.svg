<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="108" fill="#2d5a3d"/>
  <!-- Vine/leaf motif -->
  <g transform="translate(256, 256)">
    <!-- Central stem -->
    <path d="M0 120 C0 60, -20 0, 0 -60 C20 -120, 0 -160, 0 -180" 
          stroke="#6b9e78" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Left leaf -->
    <path d="M-4 -40 C-40 -80, -80 -60, -70 -30 C-60 0, -20 -10, -4 -40Z" 
          fill="#6b9e78" opacity="0.9"/>
    <!-- Right leaf -->
    <path d="M4 -100 C40 -140, 80 -120, 70 -90 C60 -60, 20 -70, 4 -100Z" 
          fill="#6b9e78" opacity="0.7"/>
    <!-- Small leaf -->
    <path d="M-4 -140 C-30 -170, -50 -155, -40 -135 C-30 -115, -10 -125, -4 -140Z" 
          fill="#6b9e78" opacity="0.5"/>
    <!-- Gold dot (kintsugi) -->
    <circle cx="0" cy="20" r="12" fill="#c4854c" opacity="0.9"/>
    <!-- Root tendrils below -->
    <path d="M0 120 C-15 150, -30 170, -50 180" stroke="#6b9e78" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M0 120 C10 145, 25 160, 40 175" stroke="#6b9e78" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M0 120 C5 155, 0 175, -10 190" stroke="#6b9e78" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>
